name: Android Build CI
on:
  push:
    branches:
      - main
jobs:
  build:

    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Build code for Android
        run:  npm install -g cordova && npm install -g ionic && yes Y | ionic cordova prepare android
      - name: Build debug APK
        run: cd platforms/android && bash ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v1
        with:
          name: healthtracker-mobile
          path: healthtracker-mobile.apk
