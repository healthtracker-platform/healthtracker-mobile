<ion-card class="card">
  <ion-card-content>
    <img alt="healthtracker" src="../../assets/logo_nombre.png" class="center"/>
    <p>
    <ion-input [(ngModel)]="email" matInput placeholder="Email" type="email" clearInput  autocomplete="email" ></ion-input>
    </p>
    <p>
      <ion-input [(ngModel)]="password" matInput placeholder="Password" type="password" clearInput  autocomplete></ion-input>
    </p>
    <ion-button expand="block" (click)="login()" >Log In</ion-button>
  </ion-card-content>
</ion-card>
